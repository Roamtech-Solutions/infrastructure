name: Development Deploy TumaTuma
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1,2,3,4,5"  # Monday-Friday at 05:00 UTC (08:00 Kenya Time)
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    name: "Deploy"
    uses: Roamtech-Solutions/infrastructure/.github/workflows/deploy-service-group.yaml@master
    with:
      environment: development
      service_group: tumatuma
    secrets: inherit

