{{- if ne "none" .Values.migration_type }}
---
# Role with Job read permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-job-reader
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
# RoleBinding to link ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-job-reader-binding
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-job-reader
  apiGroup: rbac.authorization.k8s.io
---
# Migration Job
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-{{ .Values.tag_short }}
spec:
  template:
    spec:
      containers:
      - name: migration
        image: {{ .Values.image }}-cli:{{ .Values.tag }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        # --- Phinx Migration --- #
        {{- if (eq "phinx" .Values.migration_type) }} 
        command: ["./vendor/bin/phinx", "migrate"]
        env:
            - name: MYSQL_ATTR_SSL_CA
              value: /etc/ssl/certs/mysql-ca.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass

            # --- User Managed Environment Variables --- #
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}

        # --- Artisan Migration --- #
        {{- else if (eq "artisan" .Values.migration_type) }}
        command: ["php", "artisan", "migrate", "--force"]
        env:
            - name: DB_CONNECTION
              value: mysql
            - name: MYSQL_ATTR_SSL_CA
              value: /etc/ssl/certs/mysql-ca.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass

            # --- User Managed Environment Variables --- #
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}

        # --- Django Migration --- #
        {{- else if (eq "django" .Values.migration_type) }}
        command: ["python", "manage.py", "migrate", "--noinput"]
        env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.{{ .Values.environment }}"

            # --- MySQL --- #
            {{- if has "mysql" .Values.requires }}
            - name: DB_ENGINE
              value: django.db.backends.mysql
            - name: MYSQL_ATTR_SSL_CA
              value: /etc/ssl/certs/mysql-ca.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- PostgreSQL --- #
            {{- if has "postgresql" .Values.requires }}
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: host
            - name: POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: port
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: user
            - name: POSTGRESQL_PASS
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- User Managed Environment Variables --- #
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}

        {{- else }}
        env:
            # --- User Managed Environment Variables --- #
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
        {{- end }}
        # --- RabbitMQ -- #
        {{- if has "rabbitmq" .Values.requires }}
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: host
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: port
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
        {{- end }}

        # --- Redis --- #
        {{- if has "redis" .Values.requires }}
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: port
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: user
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: pass
        {{- end }}

            - name: LOG_CHANNEL
              value: stdout
        volumeMounts:
          # --- MySQL Certificate --- #
          {{- if has "mysql" .Values.requires }}
          - name: mysql-cert
            mountPath: /etc/ssl/certs
            readOnly: true
          {{- end }}
          # -- PostgreSQL Certificate --- #
          {{- if has "postgresql" .Values.requires }}
          - name: postgresql-cert
            mountPath: /etc/ssl/certs
            readOnly: true
          {{- end }}
      volumes:
        # --- MySQL Certificate --- #
        {{- if has "mysql" .Values.requires }}
        - name: mysql-cert
          secret:
            secretName: cloudsql-cert
            items:
              - key: data
                path: mysql-ca.pem
        {{- end }}
        # -- PostgreSQL Certificate --- #
        {{- if has "postgresql" .Values.requires }}
        - name: postgresql-cert
          secret:
            secretName: cloudsql-pg-cert
            items:
              - key: data
                path: postgresql-ca.pem
        {{- end }}
      restartPolicy: Never
  backoffLimit: 1
{{- end }}

