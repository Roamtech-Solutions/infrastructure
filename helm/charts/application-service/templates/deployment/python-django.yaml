{{- if (eq "python-django" .Values.type) }} 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        # --- Django application container with Gunicorn --- #
        - name: {{ .Release.Name }}-app
          image: {{ .Values.image }}-app:{{ .Values.tag }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ .Release.Name }}
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.{{ .Values.environment }}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

            # --- MySQL --- #
            {{- if has "mysql" .Values.requires }}
            - name: DB_ENGINE
              value: django.db.backends.mysql
            - name: MYSQL_ATTR_SSL_CA
              value: /etc/ssl/certs/mysql-ca.pem
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- PostgreSQL --- #
            {{- if has "postgresql" .Values.requires }}
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- RabbitMQ --- #
            {{- if has "rabbitmq" .Values.requires }}
            - name: CELERY_BROKER_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: host
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: port
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            {{- end }}

            # --- Redis --- #
            {{- if has "redis" .Values.requires }}
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: port
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: user
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: pass
            - name: CACHE_URL
              value: redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0
            {{- end }}

            # --- PostgreSQL --- #
            {{- if has "postgresql" .Values.requires }}
            - name: POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: host
            - name: POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: port
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: user
            - name: POSTGRESQL_PASS
              valueFrom:
                secretKeyRef:
                  name: cloudsql-pg-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- User Managed Environment Variables --- #
            {{- range $k := .Values.env }}
            - name: {{ $k.name | quote }}
              value: {{ $k.value | quote }}
            {{- end }}

            # --- User Managed Secrets --- #
            {{- range $s := .Values.secrets }}
            - name: {{ $s }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}
                  key:  {{ $s }}
            {{- end }}

          volumeMounts:
            {{- if has "mysql" .Values.requires }}
            - name: mysql-cert
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}

          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck_path | default "/health/" }}
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck_path | default "/health/" }}
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      initContainers:
        # --- Wait for Migration Job to complete --- #
        {{- if ne "none" .Values.migration_type }}
        - name: wait-for-migration
          image: {{ .Values.image }}-cli:{{ .Values.tag }}
          command:
            - /bin/sh
            - -c
            - |
              until kubectl get job {{ .Release.Name }}-migration-{{ .Values.tag_short }} \
                -o jsonpath='{.status.succeeded}' | grep 1; do
                echo "Waiting for migration job to complete..."
                sleep 5
              done
          resources:
            limits:
              cpu: 50m
              ephemeral-storage: 100Mi
              memory: 64Mi
            requests:
              cpu: 50m
              ephemeral-storage: 100Mi
              memory: 64Mi
        {{- end }}

      volumes:
        {{- if has "mysql" .Values.requires }}
        # --- MySQL Certificate --- #
        - name: mysql-cert
          secret:
            secretName: cloudsql-cert
            items:
              - key: data
                path: mysql-ca.pem
        {{- end }}
{{- end }}
