{{ if not (empty .Values.secrets) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env-vars
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-env-vars
    creationPolicy: Owner
    template:
      data:
        {{- range $k, $v := .Values.secrets }}
        {{ $v }}: "{{"{{."}}{{ $v }}{{ "}}" }}"
        {{- end }}
        {{- if (.Values.mysql) }}
        mysqlRootPassword: "{{`{{.mysqlRootPassword}}`}}"
        {{- end }}
  data:
    {{- range $k, $v := .Values.secrets }}
    - secretKey: {{ $v }}
      remoteRef:
        key: {{ $k }}
    {{- end }}
    {{- if (.Values.mysql) }}
    - secretKey: mysqlRootPassword
      remoteRef:
        key: {{ .Release.Name }}-mysql-root-password
    {{- end }}
{{ end }} # If secrets is not empty

