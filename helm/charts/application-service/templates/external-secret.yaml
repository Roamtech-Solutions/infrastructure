{{ if not (empty .Values.secrets) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env-vars
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-env-vars
    creationPolicy: Owner
    template:
      data:
        {{- range $k, $v := .Values.secrets }}
        {{ $v }}: "{{"{{."}}{{ $v }}{{ "}}" }}"
        {{- end }}
  data:
    {{- range $k, $v := .Values.secrets }}
    - secretKey: {{ $v }}
      remoteRef:
        key: {{ $k }}
    {{- end }}
{{ end }} # If secrets is not empty

