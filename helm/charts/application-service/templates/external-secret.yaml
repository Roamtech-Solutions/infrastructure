{{- if not (empty .Values.secrets) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: default
    kind: SecretStore
  target:
    name: {{ .Release.Name }}
    creationPolicy: Owner
    template:
      data:
        # === User Managed Secrets === #
        {{- range $s := .Values.secrets }}
        {{ $s }}: "{{"{{."}}{{ $s }}{{ "}}" }}"
        {{- end }}
  data:
    # === User Managed Secrets === #
    {{- range $s := .Values.secrets }}
    - secretKey: {{ $s }}
      remoteRef:
        key: {{ $.Values.service_group }}-{{ $s | replace "_" "-" | lower }}
    {{- end }}
{{- end }}
