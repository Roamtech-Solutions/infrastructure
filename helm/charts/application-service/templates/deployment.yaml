---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:

            # --- MySQL --- #
            {{- if not (empty .Values.mysql) }}
            - name: {{ .Values.mysql.env.host }}
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: host
            - name: {{ .Values.mysql.env.port }}
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: port
            - name: {{ .Values.mysql.env.user }}
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: user
            - name: {{ .Values.mysql.env.pass }}
              valueFrom:
                secretKeyRef:
                  name: cloudsql-{{ .Release.Name }}
                  key: pass
            {{- end }}

            # --- RabbitMQ --- #
            {{- if not (empty .Values.rabbitmq) }}
            - name: {{ .Values.rabbitmq.env.host }}
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: host
            - name: {{ .Values.rabbitmq.env.port }}
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: port
            - name: {{ .Values.rabbitmq.env.user }}
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: {{ .Values.rabbitmq.env.pass }}
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            {{- end }}

            # --- Redis --- #
            {{- if not (empty .Values.redis) }}
            - name: {{ .Values.redis.env.host }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: host
            - name: {{ .Values.redis.env.port }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: port
            - name: {{ .Values.redis.env.user }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: user
            - name: {{ .Values.redis.env.pass }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: pass
            {{- end }}

            # --- User Managed Secrets --- #
            {{- range $s := .Values.secrets }}
            - name: {{ $s }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}
                  key:  {{ $s }}
            {{- end }}

