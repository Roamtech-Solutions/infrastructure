    cpu: 50m
    ephemeral-storage: 1Gi
    memory: 64Mi
  requests:
    cpu: 50m
    ephemeral-storage: 1Gi
    memory: 64Mi

# === Secrets === #
secrets: {}
secret_refs: {}

# === Other === #
mysql: false
rabbitmq: false

