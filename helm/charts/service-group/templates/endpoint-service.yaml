{{- range $endpoint := $.Values.external_endpoints }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $endpoint.name }}
spec:
  ports:
    - protocol: TCP
      port: {{ $endpoint.port }}
      targetPort: {{ $endpoint.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ $endpoint.name }}
subsets:
  - addresses:
      - ip: {{ $endpoint.address }}
    ports:
      - port: {{ $endpoint.port }}
