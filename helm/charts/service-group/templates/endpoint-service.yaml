{{- range $endpoint := $.Values.external_endpoints }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $endpoint.name }}
spec:
  ports:
    - protocol: TCP
      port: {{ $endpoint.port }}
      targetPort: {{ $endpoint.port }}
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ $endpoint.name }}
  labels:
    kubernetes.io/service-name: {{ $endpoint.name }}
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: {{ $endpoint.port }}
endpoints:
  - addresses:
      - {{ $endpoint.address }}
{{- end }}

