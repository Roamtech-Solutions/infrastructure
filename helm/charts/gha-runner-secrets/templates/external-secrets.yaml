---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
    iam.gke.io/gcp-service-account: {{ .Values.external_secrets_sa }}
  name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: default
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.project_id }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.region }}
          clusterName: {{ .Values.cluster_name }}
          clusterProjectID: {{ .Values.project_id }}
          # Reference to the service account in Kubernetes
          serviceAccountRef:
            name: external-secrets
            namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-config-secret
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: default
    kind: SecretStore
  target:
    name: github-config-secret
    creationPolicy: Owner
    template:
      data:
        github_app_id: "{{`{{.github_app_id}}`}}"
        github_app_installation_id: "{{`{{.github_app_installation_id}}`}}"
        github_app_private_key: "{{`{{.github_app_private_key}}`}}"
  data:
    - secretKey: github_app_id
      remoteRef:
        key: gh-app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: gh-app-installation-id
    - secretKey: github_app_private_key
      remoteRef:
        key: gh-app-private-key

