{{ if eq .Values.cluster.enabled true }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-cluster-setup
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "statefulsets"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
{{ end }}

