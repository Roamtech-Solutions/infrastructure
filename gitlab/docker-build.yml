spec:
  inputs:
    environment:
      type: string
      description: "Environment to deploy to"
    service_group:
      type: string
      description: "Service group to deploy"

stages:
  - build
  - publish

variables:
  GITLAB_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build-image:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Paykit Core is in a sub directory
    - test -d ledgers-core && cd ledgers-core || echo "skipping cd"
    - docker build -t $GITLAB_IMAGE .
    - docker push $GITLAB_IMAGE

update-values:
  image:
    name: google/cloud-sdk:latest
  stage: publish
  extends: .google-oidc:auth
  variables:
    # NOTE: OIDC variables are provided in the GitLab CI/CD group variables.
    - ENVIRONMENT: $[[ inputs.environment ]]
    - SERVICE_GROUP: $[[ inputs.service_group ]]
  script:
    - apt update && apt install -y gettext
    - envsubst < ./helm/${ENVIRONMENT}.yaml > /tmp/values.yaml
    - cat /tmp/values.yaml
    - gcloud storage cp /tmp/values.yaml gs://${MANAGEMENT_PROJECT_ID}-values/${ENVIRONMENT}/${SERVICE_GROUP}/${CI_PROJECT_NAME}.yaml

include:
  - remote: 'https://gitlab.com/gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules/-/raw/3.3.0/templates/gcp_auth.yaml'
  # Component for uploading to the GAR
  - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@0.1.0
    inputs:
      stage: publish
      source: ${GITLAB_IMAGE}
      target: europe-west1-docker.pkg.dev/${MANAGEMENT_PROJECT_ID}/docker/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}

